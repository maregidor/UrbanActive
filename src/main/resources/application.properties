# Configuración básica
spring.application.name=urbanactive
server.port=8081

# --- PERSISTENCIA H2 EN FICHERO (Sintaxis corregida para v2.x) ---
# Hemos simplificado la URL para evitar el error de "Característica no soportada"
spring.datasource.url=jdbc:h2:file:./data/urbanactivedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- CONSOLA H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Esto permite que la consola cargue correctamente en marcos (iframes)
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# --- CONFIGURACIÓN JPA / HIBERNATE ---
# Hibernate detectará automáticamente el dialecto, no hace falta forzarlo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

