<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f6f8fb 0%, #eef4ff 100%);
}

.top-nav {
    background: white;
    border-bottom: 1px solid #eef1f4;
}

.brand {
    font-weight: 800;
    font-size: 1.7rem;
    color: #0d6efd;
    text-decoration: none;
}

.wrapper {
    min-height: calc(100vh - 76px);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-select {
    max-width: 800px;
    width: 100%;
    background: white;
    border-radius: 28px;
    padding: 40px;
    box-shadow: 0 18px 40px rgba(16,24,40,0.08);
}

.option-card {
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    transition: 0.25s;
    cursor: pointer;
}

.option-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(13,110,253,0.2);
}

.icon {
    font-size: 2.5rem;
    color: #0d6efd;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<nav class="top-nav shadow-sm">
    <div class="container-fluid d-flex justify-content-between px-4 py-3">
        <a class="brand" href="/">UrbanActive</a>
    </div>
</nav>

<div class="wrapper">
    <div class="card-select">

        <h2 class="fw-bold text-center mb-4">¿Cómo quieres registrarte?</h2>

        <div class="row g-4">

            <div class="col-md-6">
                <a href="/register/usuario" class="text-decoration-none text-dark">
                    <div class="option-card">
                        <div class="icon">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h4 class="fw-bold">Usuario</h4>
                        <p class="text-muted">Reserva actividades y participa</p>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <a href="/register/organizacion" class="text-decoration-none text-dark">
                    <div class="option-card">
                        <div class="icon">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h4 class="fw-bold">Organización</h4>
                        <p class="text-muted">Crea y gestiona actividades</p>
                    </div>
                </a>
            </div>

        </div>

    </div>
</div>

</body>
</html>
