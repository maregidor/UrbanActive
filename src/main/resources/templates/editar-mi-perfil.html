<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Editar mi perfil | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
font-family: 'Inter', sans-serif;
background: #f6f8fb;
}

.edit-card {
max-width: 640px;
margin: 60px auto;
border: none;
border-radius: 28px;
box-shadow: 0 16px 40px rgba(16,24,40,.08);
}

.form-control {
border-radius: 14px;
padding: 12px 14px;
}

.btn {
border-radius: 999px;
font-weight: 700;
padding: 12px 22px;
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold" href="/">UrbanActive</a>
</div>
</nav>

<div class="container">
<div class="card edit-card">
<div class="card-body p-4">

<h2 class="fw-bold mb-1">Editar mi perfil</h2>
<p class="text-muted mb-4">Puedes modificar tu nombre y nivel. El email no se puede cambiar.</p>

<form th:action="@{/mi-perfil/editar}" method="post">

<div class="mb-3">
<label class="form-label fw-semibold">Email</label>
<input type="text"
class="form-control"
th:value="${usuario.email.direccion}"
disabled>
<div class="form-text">El email no se puede modificar porque identifica tu cuenta.</div>
</div>

<div class="mb-3">
<label class="form-label fw-semibold">Nombre</label>
<input type="text"
name="nombre"
class="form-control"
th:value="${usuario.nombre}"
required>
</div>

<div class="mb-4">
<label class="form-label fw-semibold">Nivel de experiencia</label>
<input type="number"
name="nivelExperiencia"
class="form-control"
min="0"
max="10"
step="0.1"
th:value="${usuario.nivelExperiencia != null ? usuario.nivelExperiencia.valor : 0}"
required>
</div>

<div class="d-flex gap-3">
<button type="submit" class="btn btn-primary">
Guardar cambios
</button>

<a href="/mi-perfil" class="btn btn-outline-secondary">
Cancelar
</a>
</div>

</form>

</div>
</div>
</div>

</body>
</html>
