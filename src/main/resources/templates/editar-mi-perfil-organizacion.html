<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil Organización | UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background: #f6f8fb; }
        .edit-card { 
            max-width: 640px; 
            margin: 60px auto; 
            border: none; 
            border-radius: 28px; 
            box-shadow: 0 16px 40px rgba(16,24,40,.08); 
        }
        .form-control { border-radius: 14px; padding: 12px 14px; }
        .btn { border-radius: 999px; font-weight: 700; padding: 12px 22px; }
        .bg-orga { background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-orga shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/actividades">UrbanActive</a>
        </div>
    </nav>

    <div class="container">
        <div class="card edit-card">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-1">Editar Perfil Corporativo</h2>
                <p class="text-muted mb-4">Actualiza la información pública de tu organización.</p>

                <form th:action="@{/organizacion/editar}" method="post">

                    <!-- Email (Solo lectura) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email de contacto</label>
                        <input type="text" class="form-control bg-light" 
                               th:value="${organizacion.email.direccion}" disabled>
                    </div>

                    <!-- CIF (Solo lectura, identifica a la empresa) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">CIF</label>
                        <input type="text" class="form-control bg-light" 
                               th:value="${organizacion.cif}" disabled>
                        <div class="form-text">El identificador fiscal no es editable.</div>
                    </div>

                    <!-- Nombre de la Organización -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la Organización</label>
                        <input type="text" name="nombre" class="form-control" 
                               th:value="${organizacion.nombre}" required>
                    </div>

                    <!-- Tipo de Actividad -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Especialidad Deportiva</label>
                        <input type="text" name="actividad" class="form-control" 
                               placeholder="Ej: Calistenia, Yoga, Running..."
                               th:value="${organizacion.actividad}" required>
                        <div class="form-text">Esto ayuda a que los usuarios os encuentren mejor.</div>
                    </div>

                    <div class="d-flex gap-3 mt-5">
                        <button type="submit" class="btn btn-primary px-5">
                            Guardar cambios
                        </button>
                        <a href="/mi-perfil-organizacion" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
