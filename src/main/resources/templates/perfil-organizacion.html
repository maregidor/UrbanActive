<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Perfil Organización | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/perfil-organizacion.css}">

</head>

<body class="bg-light">

<nav class="top-nav">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
            <div class="fw-bold fs-2">UrbanActive</div>

            <div class="d-flex align-items-center gap-4">
                <a href="/actividades" class="nav-link menu-link active">Actividades</a>
                <a href="/reservas/mis-reservas" class="nav-link menu-link">Mis Reservas</a>
                <a href="/logout" class="nav-link menu-link">Cerrar sesión</a>
            </div>
        </div>
    </nav>

<div class="container">

<div class="card perfil-card shadow-sm">

<!-- HEADER -->
<div class="perfil-header d-flex justify-content-between align-items-center">

<div class="d-flex align-items-center gap-3">

<!-- Avatar -->
<div class="avatar-circle">
<span th:text="${organizacion.nombre != null ? #strings.substring(organizacion.nombre,0,1) : 'O'}">
O
</span>
</div>

<!-- Nombre -->
<div>
<h3 class="mb-1 fw-bold" th:text="${organizacion.nombre}">Nombre Organización</h3>
<small class="opacity-75">Organización</small>
</div>

</div>

<!-- Seguimiento -->
<div class="d-flex flex-column align-items-end gap-2">
<div class="text-white fw-semibold">
<span th:text="${numSeguidores}">0</span> seguidores
</div>

<form th:if="${!yaLaSigue}" method="post"
th:action="@{/organizaciones/{slug}/seguir(
slug=${organizacion.slug}
)}">
<button class="btn btn-light btn-follow fw-semibold" type="submit">
Seguir
</button>
</form>

<form th:if="${yaLaSigue}" method="post"
th:action="@{/organizaciones/{slug}/dejar-seguir(
slug=${organizacion.slug}
)}">
<button class="btn btn-outline-light btn-follow fw-semibold" type="submit">
Dejar de seguir
</button>
</form>
</div>

</div>

<!-- BODY -->
<div class="card-body p-4">

<div class="row g-4">

<div class="col-md-6">
<div class="info-box">
<h6 class="fw-bold mb-2">
<i class="fas fa-star me-2"></i> Valoración
</h6>
<p class="mb-1">
<strong>Estrellas:</strong>
<span th:text="${organizacion.valoracion != null ? organizacion.valoracion.estrellas : 'Sin datos'}">
⭐⭐⭐⭐
</span>
</p>
<p class="mb-0">
<strong>Puntuación:</strong>
<span th:text="${organizacion.valoracion != null ? organizacion.valoracion.puntuacion : '0'}">
4.5
</span>
</p>
</div>
</div>

</div>
<div class="mt-5">
<h4 class="fw-bold mb-3">Actividades publicadas</h4>

<div th:if="${#lists.isEmpty(actividades)}" class="text-muted">
Esta organización todavía no ha publicado actividades.
</div>

<div class="row g-4" th:if="${!#lists.isEmpty(actividades)}">
<div class="col-md-6" th:each="actividad : ${actividades}">
<div class="card shadow-sm h-100 border-0 rounded-4">
<img th:src="${actividad.imagen}" class="card-img-top"
style="height: 180px; object-fit: cover;"
onerror="this.src='https://via.placeholder.com/400x200?text=UrbanActive'">

<div class="card-body">
<h5 class="fw-bold mb-2" th:text="${actividad.titulo}">Título</h5>
<p class="text-muted small mb-2" th:text="${actividad.tipo}">Tipo</p>

<p class="mb-2">
<i class="fa-regular fa-calendar me-2"></i>
<span th:text="${actividad.fecha} + ' · ' + ${actividad.hora}">Fecha</span>
</p>

<p class="mb-3">
<i class="fa-solid fa-location-dot me-2"></i>
<span th:text="${actividad.espacioPublico != null ? actividad.espacioPublico.nombre : 'Ubicación pendiente'}">Lugar</span>
</p>

<a th:href="@{/actividades/{id}(id=${actividad.id})}" class="btn btn-primary rounded-pill px-4">
Ver actividad
</a>
</div>
</div>
</div>
</div>
</div>
<!-- Botones -->
<div class="text-center mt-4">
<a href="/actividades" class="btn btn-outline-primary rounded-pill px-4">
<i class="fas fa-arrow-left me-2"></i> Volver a actividades
</a>
</div>

</div>

</div>

</div>

</body>
</html>
