<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Plaza - UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">UrbanActive</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/actividades">Actividades</a>
                <a class="nav-link" href="/reservas/mis-reservas">Mis Reservas</a>
                <a class="nav-link" href="/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Confirmar Reserva</h4>
                    </div>
                    <div class="card-body">
                        <h5>Actividad: <span th:text="${actividad.titulo}">Título</span></h5>
                        <p>Precio: <span th:text="${actividad.precio > 0 ? actividad.precio + '€' : 'Gratis'}">Precio</span></p>
                        
                        <div class="mb-4">
                            <h5>Usuario: <span th:text="${usuario.nombre}">Nombre</span></h5>
                            <p>Email: <span th:text="${usuario.email.direccion}">email</span></p>
                        </div>

                        <form th:action="@{/reservas/procesar}" method="post">
                            <input type="hidden" name="actividadId" th:value="${actividad.id}">
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/actividades}" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Confirmar Reserva</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
