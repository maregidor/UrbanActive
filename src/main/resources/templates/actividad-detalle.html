<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle actividad</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS externo -->
  <link rel="stylesheet" href="style-actividad-detallada.css">
</head>

<body>

  <!-- MENÚ SUPERIOR -->
  <nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">UrbanActive</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuWeb">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuWeb">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="mapa.html">Mapa</a></li>
          <li class="nav-item"><a class="nav-link" href="seguidos.html">Seguidos</a></li>
          <li class="nav-item"><a class="nav-link active" href="actividades.html">Actividades</a></li>
          <li class="nav-item"><a class="nav-link" href="crear.html">Crear</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-container">

    <div class="activity-layout">

      <!-- IZQUIERDA -->
      <section>

        <div class="hero-card">
          <div class="hero-image-wrapper">
            <img id="activity-image" src="img/default.jpg">
            <a href="actividades.html" class="back-btn">
              <i class="fa-solid fa-arrow-left"></i>
            </a>
          </div>

          <div class="hero-content">

            <div>
              <span class="tag-chip blue-chip" id="activity-category">Actividad</span>
              <span class="tag-chip green-chip" id="activity-visibility">
                <i class="fa-solid fa-earth-europe me-1"></i>Pública
              </span>
            </div>

            <h1 class="activity-title" id="activity-title">Cargando...</h1>
            <p class="activity-subtitle" id="activity-subtitle">...</p>

            <div class="info-grid">

              <div class="info-mini">
                <i class="fa-regular fa-calendar"></i>
                <div>
                  <span class="label">Fecha</span>
                  <strong id="activity-date"></strong>
                </div>
              </div>

              <div class="info-mini">
                <i class="fa-regular fa-clock"></i>
                <div>
                  <span class="label">Hora</span>
                  <strong id="activity-time"></strong>
                </div>
              </div>

              <div class="info-mini">
                <i class="fa-solid fa-users"></i>
                <div>
                  <span class="label">Participantes</span>
                  <strong id="activity-participants"></strong>
                </div>
              </div>

              <div class="info-mini">
                <i class="fa-regular fa-star"></i>
                <div>
                  <span class="label">Nivel</span>
                  <strong id="activity-level"></strong>
                </div>
              </div>

            </div>

            <div class="card-custom">
              <div class="card-title-small">Ubicación</div>
              <div id="activity-location"></div>
            </div>

          </div>
        </div>

      </section>

      <!-- DERECHA -->
      <aside>

        <div class="metrics-row">

          <div class="card-metric weather-card">
            <div class="metric-title">Clima</div>
            <div class="metric-big" id="activity-weather-temp"></div>
            <div id="activity-weather-status"></div>
            <div id="activity-weather-wind"></div>
            <div id="activity-weather-feels"></div>
          </div>

          <div class="card-metric traffic-card">
            <div class="metric-title">Tráfico</div>
            <div class="traffic-status" id="activity-traffic-status"></div>
            <div class="metric-big" id="activity-traffic-time"></div>
          </div>

        </div>

        <div class="sidebar-card">
          <div class="card-title-small">Monitor</div>
          <div id="activity-monitor"></div>
        </div>

        <div class="sidebar-card">
          <div class="card-title-small">Descripción</div>
          <p id="activity-description"></p>
        </div>

        <div class="sidebar-card">
          <div class="row">
            <div class="col-6">
              <div class="label">Duración</div>
              <strong id="activity-duration"></strong>
            </div>
            <div class="col-6 text-end">
              <div class="label">Precio</div>
              <strong class="price-text" id="activity-price"></strong>
            </div>
          </div>
        </div>

        <button class="reserve-btn" id="reserve-button">Reservar plaza</button>

      </aside>

    </div>

  </main>

  <!-- SCRIPT -->
  <script>
    async function cargarActividad() {
      const id = new URLSearchParams(window.location.search).get("id");

      const res = await fetch(`/api/actividades/${id}`);
      const a = await res.json();

      document.getElementById("activity-title").textContent = a.titulo;
      document.getElementById("activity-subtitle").textContent = "Organizada por " + a.organizador;
      document.getElementById("activity-date").textContent = a.fecha;
      document.getElementById("activity-time").textContent = a.hora;
      document.getElementById("activity-participants").textContent = `${a.participantes_actuales}/${a.participantes_max}`;
      document.getElementById("activity-level").textContent = a.nivel;
      document.getElementById("activity-location").textContent = a.ubicacion;
      document.getElementById("activity-description").textContent = a.descripcion;
      document.getElementById("activity-price").textContent = a.precio;
      document.getElementById("activity-duration").textContent = a.duracion;
      document.getElementById("activity-monitor").textContent = a.organizador;
      document.getElementById("activity-image").src = a.imagen;
    }

    cargarActividad();
  </script>

</body>
</html>
