<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear actividad | UrbanActive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="top-nav">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
        <div class="fw-bold fs-2">UrbanActive</div>

        <div class="d-flex align-items-center gap-4">
            <a href="/actividades" class="nav-link menu-link">Volver</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <h1 class="fw-bold mb-4">Crear nueva actividad</h1>
    <div class="card p-4 shadow-sm">

        <form action="#" method="post">

            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" name="titulo" class="form-control" placeholder="Ej: Yoga en el parque" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio (€)</label>
                <input type="number" name="precio" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Hora</label>
                <input type="time" name="hora" class="form-control">
            </div>

            <button type="submit" class="btn btn-success rounded-pill px-4">
                Crear actividad
            </button>

        </form>

    </div>

</div>

</body>
</html>
