<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${actividad.tipo} + ' | UrbanActive'">Detalle actividad</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/actividad-detalle.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<nav class="top-nav">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
            <div class="fw-bold fs-2">UrbanActive</div>

            <div class="d-flex align-items-center gap-4">
                <a href="/actividades" class="nav-link menu-link active">Actividades</a>
                <a sec:authorize="isAuthenticated()" href="/reservas/mis-reservas" class="nav-link menu-link">Mis Reservas</a>
                <!-- 🔓 NO autenticado -->
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="nav-link menu-link">
                        Iniciar sesión
                    </a>
                </div>

                <!-- 🔒 Autenticado -->
                <div sec:authorize="isAuthenticated()">
                    <a href="/logout" class="nav-link menu-link">
                        Cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </nav>

<div class="page-container px-3">
  <div class="activity-layout">

    <section class="hero-card">
      <div class="hero-image-wrapper">
        <img th:src="${actividad.imagen}" src="/img/default.jpg" alt="Imagen actividad">
        <a th:href="@{/actividades}" class="back-btn">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
      </div>

      <div class="p-4">

        <div class="small text-muted mb-2">
          <span th:text="${actividad.tipo}">Tipo</span>
          <span class="badge bg-success ms-2">Pública</span>
        </div>

        <h1 class="activity-title mb-2" th:text="${actividad.tipo}">Actividad</h1>

        <p class="activity-subtitle mb-4" th:text="${actividad.nombreOrganizador}">Organizador</p>

        <div class="info-grid mb-4">

          <div class="info-mini">
            <i class="fa-regular fa-calendar"></i>
            <div>
              <div class="fw-semibold">Fecha</div>
              <div th:text="${actividad.fecha}"></div>
            </div>
          </div>

          <div class="info-mini">
            <i class="fa-regular fa-clock"></i>
            <div>
              <div class="fw-semibold">Hora</div>
              <div th:text="${actividad.hora}"></div>
            </div>
          </div>

          <div class="info-mini">
            <i class="fa-solid fa-users"></i>
            <div>
              <div class="fw-semibold">Plazas libres</div>
              <div th:text="${actividad.plazasDisponibles}"></div>
            </div>
          </div>

          <div class="info-mini">
            <i class="fa-regular fa-star text-primary"></i>
            <div>
              <div class="fw-semibold">Nivel</div>
              <div th:text="${actividad.nivel}"></div>
            </div>
          </div>

        </div>

        <div class="info-mini">
          <i class="fa-regular fa-star"></i>
          <div>
            <div class="fw-semibold">Valoración</div>
            <div th:text="${actividad.organizacion.valoracion}"></div>
          </div>
        </div>

        <div class="card-custom">
          <div class="fw-semibold mb-2">Ubicación</div>
          <div th:text="${actividad.espacioPublico.nombre}"></div>
        </div>

      </div>
    </section>

    <aside>

      <div class="metrics-row">

        <div class="card-metric weather-card">
          <div class="metric-title">Clima</div>

          <div th:if="${contexto != null and contexto.weather != null}">
            <div class="weather-main" th:text="${contexto.weather.estadoCielo}"></div>
            <div class="weather-temp" th:text="${contexto.weather.temperatura}"></div>
            <div class="metric-text">
              <span th:text="${contexto.weather.viento}"></span>
              <span th:if="${contexto.weather.probabilidadLluvia != null}"
                    th:text="' · ' + ${contexto.weather.probabilidadLluvia}"></span>
            </div>
          </div>

          <div th:if="${contexto == null or contexto.weather == null}">
            <div class="weather-main">No disponible</div>
            <div class="weather-temp">-</div>
            <div class="metric-text">- - -</div>
          </div>
        </div>

        <div class="card-metric traffic-card">
          <div class="metric-title">Trayecto</div>

          <div th:if="${contexto != null and contexto.traffic != null}">
            <div class="traffic-level"
                 th:classappend="${contexto.traffic.nivel == 'Bajo' ? 'traffic-low' :
                                (contexto.traffic.nivel == 'Medio' ? 'traffic-medium' : 'traffic-high')}"
                 th:text="${contexto.traffic.nivel}">
            </div>

            <div class="metric-text" th:text="${contexto.traffic.resumen}"></div>
          </div>

          <div th:if="${contexto == null or contexto.traffic == null}" class="metric-text">
            No hay datos de trayecto
          </div>
        </div>

      </div>

      <div class="price-box text-start">
        <div class="price-label">Precio</div>
        <div class="price-value" th:text="${actividad.precio} + ' €'"></div>
      </div>

      <form th:action="@{/reservas/procesar}" method="post" class="reserve-form">
        <input type="hidden" name="actividadId" th:value="${actividad.id}">

        <button type="submit"
                class="btn btn-primary reserve-btn"
                th:disabled="${yaReservada or actividad.plazasDisponibles <= 0}">

          <span th:text="${yaReservada ? 'Ya reservada' : (actividad.plazasDisponibles > 0 ? 'Reservar plaza ahora' : 'Sin plazas disponibles')}">
            Reservar plaza ahora
          </span>
        </button>
      </form>

      <p class="reserve-note">
        Al reservar, aceptas nuestras normas de uso urbano.
      </p>
    </aside>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const url = new URL(window.location.href);

  if (!url.searchParams.has("userLat") || !url.searchParams.has("userLon")) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(position) {
          url.searchParams.set("userLat", position.coords.latitude);
          url.searchParams.set("userLon", position.coords.longitude);
          window.location.replace(url.toString());
        }
      );
    }
  }
});
</script>

</body>
</html>
