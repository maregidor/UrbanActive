<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Confirmada - UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">UrbanActive</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/actividades">Actividades</a>
                <a class="nav-link" href="/reservas/mis-reservas">Mis Reservas</a>
                <a class="nav-link" href="/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-check-circle-fill"></i>
                            ¡Reserva Realizada con Éxito!
                        </h4>
                    </div>
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                        </div>
                        
                        <h3 class="mb-3">¡Tu plaza ha sido reservada!</h3>
                        <p class="lead mb-4">Tu reserva ha sido confirmada y la plaza ha sido asignada correctamente.</p>

                        <div th:if="${mensajeExito}" class="alert alert-success">
                            <span th:text="${mensajeExito}">Mensaje de éxito</span>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a th:href="@{/reservas/mis-reservas}" class="btn btn-primary me-md-2">
                                <i class="bi bi-list"></i> Ver Mis Reservas
                            </a>
                            <a th:href="@{/actividades}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Volver a Actividades
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
