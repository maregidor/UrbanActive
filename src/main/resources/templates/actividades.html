<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Actividades | UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .card-activity { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; }
        .card-activity:hover { transform: translateY(-5px); }
        .img-container { height: 200px; object-fit: cover; }
        .top-nav { background: white; border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="bg-light">

    <nav class="top-nav sticky-top shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <div class="fw-bold fs-3 text-primary">UrbanActive</div>
            <div class="d-flex gap-3">
                <a th:href="@{/actividades}" class="btn btn-primary rounded-pill px-4">Actividades</a>
                <a href="#" class="btn btn-outline-secondary rounded-pill">Mi Perfil</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <h1 class="fw-bold">Actividades disponibles</h1>
                <p class="text-muted">Encuentra y reserva tu próxima sesión deportiva en la ciudad.</p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            
            <div class="col" th:each="actividad : ${actividades}">
                <div class="card h-100 shadow-sm card-activity">
                    <img th:src="${actividad.imagen}" class="card-img-top img-container" alt="Imagen actividad"
                         onerror="this.src='https://via.placeholder.com/400x200?text=UrbanActive'">
                    
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3" th:text="${actividad.tipo}">Tipo</span>
                            <span class="fw-bold text-success" th:text="${actividad.precio > 0 ? actividad.precio + '€' : 'Gratis'}">0€</span>
                        </div>
                        
                        <h5 class="card-title fw-bold" th:text="${actividad.titulo}">Título</h5>
                        <div class="d-grid">
                            <a th:href="@{/actividades/{id}(id=${actividad.id})}" class="btn btn-outline-primary rounded-pill">
                                Ver detalles <i class="fas fa-arrow-right ms-1"></i>
                            </a>
                        </div>
