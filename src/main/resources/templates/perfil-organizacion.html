<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Perfil Organización | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/perfil-organizacion.css}">

</head>

<body class="bg-light">

<nav class="top-nav">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
            <div class="fw-bold fs-2">UrbanActive</div>

            <div class="d-flex align-items-center gap-4">
                <a href="/actividades" class="nav-link menu-link active">Actividades</a>
                <a href="/reservas/mis-reservas" class="nav-link menu-link">Mis Reservas</a>
                <a href="/logout" class="nav-link menu-link">Cerrar sesión</a>
            </div>
        </div>
    </nav>

<div class="container">

<div class="card perfil-card shadow-sm">

<!-- HEADER -->
<div class="perfil-header d-flex justify-content-between align-items-center">

<div class="d-flex align-items-center gap-3">

<!-- Avatar -->
<div class="avatar-circle">
<span th:text="${organizacion.nombre != null ? #strings.substring(organizacion.nombre,0,1) : 'O'}">
O
</span>
</div>

<!-- Nombre -->
<div>
<h3 class="mb-1 fw-bold" th:text="${organizacion.nombre}">Nombre Organización</h3>
<small class="opacity-75">Organización</small>
</div>

</div>

<!-- Botón seguir -->
<form method="post"
th:action="@{/organizaciones/{tipo}/{numero}/seguir(
tipo=${organizacion.identificacion.tipo},
numero=${organizacion.identificacion.numero}
)}">
<button class="btn btn-light btn-follow fw-semibold">
<i class="fas fa-user-plus me-1"></i> Seguir
</button>
</form>

</div>

<!-- BODY -->
<div class="card-body p-4">

<div class="row g-4">

<div class="col-md-6">
<div class="info-box">
<h6 class="fw-bold mb-2">
<i class="fas fa-id-card me-2"></i> Identificación
</h6>
<p class="mb-1">
<strong>Tipo:</strong>
<span th:text="${organizacion.identificacion.tipo}">CIF</span>
</p>
<p class="mb-0">
<strong>Número:</strong>
<span th:text="${organizacion.identificacion.numero}">000000</span>
</p>
</div>
</div>

<div class="col-md-6">
<div class="info-box">
<h6 class="fw-bold mb-2">
<i class="fas fa-star me-2"></i> Valoración
</h6>
<p class="mb-1">
<strong>Estrellas:</strong>
<span th:text="${organizacion.valoracion != null ? organizacion.valoracion.estrellas : 'Sin datos'}">
⭐⭐⭐⭐
</span>
</p>
<p class="mb-0">
<strong>Puntuación:</strong>
<span th:text="${organizacion.valoracion != null ? organizacion.valoracion.puntuacion : '0'}">
4.5
</span>
</p>
</div>
</div>

</div>

<!-- Botones -->
<div class="text-center mt-4">
<a href="/actividades" class="btn btn-outline-primary rounded-pill px-4">
<i class="fas fa-arrow-left me-2"></i> Volver a actividades
</a>
</div>

</div>

</div>

</div>

</body>
</html>
