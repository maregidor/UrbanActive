<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistentes | UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/actividades.css}">
</head>
<body class="bg-light">

    <nav class="top-nav shadow-sm bg-white mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
            <div class="fw-bold fs-2 text-primary">UrbanActive</div>
            <a href="/mis-actividades-organizacion" class="btn btn-outline-primary rounded-pill btn-sm">
                <i class="fas fa-arrow-left me-2"></i>Volver a mis actividades
            </a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white border-0 p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold h4 mb-1" th:text="'Asistentes: ' + ${actividad.titulo}">Asistentes</h2>
                        <p class="text-muted small mb-0">
                            <i class="far fa-calendar-alt me-1"></i> <span th:text="${actividad.fecha}">Fecha</span> | 
                            <i class="fas fa-users me-1"></i> <span th:text="${#lists.size(asistentes)} + '/' + ${actividad.plazasTotales}">0/0</span> plazas ocupadas
                        </p>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Nombre del Usuario</th>
                            <th>Email de contacto</th>
                            <th>Nivel declarado</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(asistentes)}">
                            <td colspan="4" class="text-center py-5">
                                <p class="text-muted mb-0">Aún no hay usuarios inscritos en esta actividad.</p>
                            </td>
                        </tr>
                        
                        <tr th:each="usuario : ${asistentes}">
                            <td class="ps-4">
                                <div class="fw-bold text-dark" th:text="${usuario.nombre}">Nombre</div>
                            </td>
                            <td>
                                <span th:text="${usuario.email.direccion}">email@ejemplo.com</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill bg-info text-dark" 
                                      th:text="'Nivel ' + ${usuario.nivelExperiencia.valor}">Nivel</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="'mailto:' + ${usuario.email.direccion}" class="btn btn-light btn-sm">
                                    <i class="fas fa-envelope me-1"></i>Contactar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
