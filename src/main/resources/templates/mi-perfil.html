<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Mi perfil | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" th:href="@{/css/mi-perfil.css}">
</head>

<body>

<nav class="top-nav">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
        <div class="fw-bold fs-2">UrbanActive</div>

        <div class="d-flex align-items-center gap-4">
            <a href="/actividades" class="nav-link menu-link active">Actividades</a>
            <a href="/reservas/mis-reservas" class="nav-link menu-link">Mis Reservas</a>
            <a href="/mis-seguidos" class="nav-link menu-link">Mis Seguidos</a>
            <a href="/mi-perfil" class="nav-link menu-link">Mi perfil</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card profile-card">

        <div class="profile-header">
            <div class="avatar">
                <span th:text="${usuario.nombre != null ? #strings.substring(usuario.nombre,0,1) : 'U'}">U</span>
            </div>

            <div>
                <h1 class="fw-bold mb-1" th:text="${usuario.nombre}">Nombre usuario</h1>
                <p class="mb-0 opacity-75" th:text="${usuario.email.direccion}">email@email.com</p>
            </div>
        </div>

        <div class="card-body p-4">
            <h4 class="fw-bold mb-3">Mis datos</h4>

            <div class="data-box mb-4">
                <div class="data-row">
                    <span class="text-muted">Nombre</span>
                    <strong th:text="${usuario.nombre}">Nombre</strong>
                </div>

                <div class="data-row">
                    <span class="text-muted">Email</span>
                    <strong th:text="${usuario.email.direccion}">email@email.com</strong>
                </div>

                <div class="data-row">
                    <span class="text-muted">Nivel</span>
                    <strong th:text="${usuario.nivelExperiencia != null ? usuario.nivelExperiencia.valor : 'No indicado'}">Nivel</strong>
                </div>
            </div>

            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <button class="btn w-100 bg-white border rounded-4 p-4 text-start shadow-sm"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#seguidoresCollapse">
                        <h5 class="fw-bold mb-1" th:text="${numSeguidores}">0</h5>
                        <p class="text-muted mb-0">Seguidores</p>
                    </button>

                    <div class="collapse mt-3" id="seguidoresCollapse">
                        <div class="card card-body rounded-4">
                            <div th:if="${#lists.isEmpty(seguidores)}" class="text-muted">
                                Todavía no tienes seguidores.
                            </div>

                            <div th:each="seguidor : ${seguidores}" class="py-2 border-bottom">
                                <a th:href="@{/usuarios/{slug}(slug=${seguidor.slug})}"
                                   class="text-decoration-none fw-semibold"
                                   th:text="${seguidor.nombre}">
                                    Nombre usuario
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <button class="btn w-100 bg-white border rounded-4 p-4 text-start shadow-sm"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#seguidosCollapse">
                        <h5 class="fw-bold mb-1" th:text="${numSeguidos}">0</h5>
                        <p class="text-muted mb-0">Seguidos</p>
                    </button>

                    <div class="collapse mt-3" id="seguidosCollapse">
                        <div class="card card-body rounded-4">
                            <div th:if="${#lists.isEmpty(seguidos)}" class="text-muted">
                                Todavía no sigues a ningún usuario.
                            </div>

                            <div th:each="seguido : ${seguidos}" class="py-2 border-bottom">
                                <a th:href="@{/usuarios/{slug}(slug=${seguido.slug})}"
                                   class="text-decoration-none fw-semibold"
                                   th:text="${seguido.nombre}">
                                    Nombre usuario
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="d-flex gap-3 flex-wrap">
                <a href="/mi-perfil/editar" class="btn btn-primary btn-rounded">
                    <i class="fa-solid fa-pen me-2"></i>
                    Modificar datos
                </a>

                <a href="/logout" class="btn btn-outline-danger btn-rounded">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>
                    Cerrar sesión
                </a>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
