<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Usuario | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f6f8fb, #eef4ff);
}

.form-card {
    max-width: 500px;
    margin: auto;
    background: white;
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.08);
}

.input {
    border-radius: 14px;
    padding: 12px;
}
</style>
</head>

<body class="d-flex align-items-center" style="min-height:100vh;">

<div class="form-card">

    <h2 class="fw-bold text-center mb-4">Crear cuenta de usuario</h2>

    <form method="post" action="/register/usuario">

        <input name="nombre" class="form-control input mb-3" placeholder="Nombre" required>

        <input name="email" class="form-control input mb-3" placeholder="Email" required>

        <input type="password" name="password" class="form-control input mb-3" placeholder="Contraseña" required>

        <input type="number" name="nivelExperienciaValor" class="form-control input mb-3" placeholder="Nivel de experiencia (0-10)" step="0.1" min="0" max="10" required>

        <input name="actividadInteres" class="form-control input mb-3" placeholder="Actividad de interés" required>

        <button class="btn btn-primary w-100 rounded-pill fw-bold">
            Registrarse
        </button>

    </form>

</div>

</body>
</html>
