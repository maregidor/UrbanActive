<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | UrbanActive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
font-family: 'Inter', sans-serif;
background: linear-gradient(135deg, #f6f8fb 0%, #eef4ff 100%);
min-height: 100vh;
}

.top-nav {
background: white;
border-bottom: 1px solid #eef1f4;
}

.brand {
font-weight: 800;
font-size: 1.7rem;
color: #0d6efd;
text-decoration: none;
}

.login-wrapper {
min-height: calc(100vh - 76px);
display: flex;
align-items: center;
justify-content: center;
padding: 40px 16px;
}

.login-card {
width: 100%;
max-width: 460px;
background: white;
border-radius: 28px;
border: 1px solid #edf0f3;
box-shadow: 0 18px 40px rgba(16, 24, 40, 0.08);
overflow: hidden;
}

.login-header {
padding: 32px 32px 20px;
text-align: center;
}

.login-icon {
width: 88px;
height: 88px;
margin: 0 auto 18px;
border-radius: 50%;
background: #eaf2ff;
color: #0d6efd;
display: flex;
align-items: center;
justify-content: center;
font-size: 2.2rem;
}

.login-title {
font-size: 2rem;
font-weight: 800;
color: #111827;
margin-bottom: 8px;
}

.login-subtitle {
color: #6b7280;
font-size: 1rem;
margin-bottom: 0;
}

.login-body {
padding: 8px 32px 32px;
}

.form-label {
font-weight: 700;
color: #374151;
margin-bottom: 8px;
}

.input-group-custom {
position: relative;
margin-bottom: 18px;
}

.input-icon {
position: absolute;
left: 16px;
top: 50%;
transform: translateY(-50%);
color: #9aa3af;
z-index: 2;
}

.form-control-custom {
width: 100%;
border: 1px solid #dbe2ea;
border-radius: 16px;
padding: 14px 16px 14px 46px;
font-size: 1rem;
transition: all 0.2s ease;
background: #fff;
}

.form-control-custom:focus {
outline: none;
border-color: #86b7fe;
box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
}

.login-btn {
width: 100%;
border: none;
border-radius: 999px;
padding: 15px 20px;
font-weight: 800;
font-size: 1rem;
color: white;
background: linear-gradient(135deg, #0d6efd, #3d8bfd);
box-shadow: 0 10px 22px rgba(13, 110, 253, 0.25);
transition: all 0.25s ease;
}

.login-btn:hover {
transform: translateY(-2px);
box-shadow: 0 14px 28px rgba(13, 110, 253, 0.30);
}

.login-alert {
display: flex;
gap: 12px;
align-items: flex-start;
border-radius: 16px;
padding: 14px 16px;
margin-bottom: 18px;
font-size: 0.95rem;
}

.login-alert i {
margin-top: 2px;
}

.alert-error {
background: #fff5f5;
color: #b02a37;
border: 1px solid #f1c0c7;
}

.alert-logout {
background: #ecfdf3;
color: #146c43;
border: 1px solid #c7f0d8;
}

.login-footer {
text-align: center;
margin-top: 18px;
color: #9aa3af;
font-size: 0.93rem;
}

.login-footer a {
color: #0d6efd;
text-decoration: none;
font-weight: 700;
}

@media (max-width: 576px) {
.login-header {
padding: 26px 20px 16px;
}

.login-body {
padding: 8px 20px 24px;
}

.login-title {
font-size: 1.7rem;
}
}
</style>
</head>
<body>

<nav class="top-nav shadow-sm">
<div class="container-fluid d-flex justify-content-between align-items-center px-4 py-3">
<a class="brand" href="/">UrbanActive</a>
</div>
</nav>

<div class="login-wrapper">
<div class="login-card">

<div class="login-header">
<div class="login-icon">
<i class="fa-solid fa-user-lock"></i>
</div>
<div class="login-title">Iniciar sesión</div>
<p class="login-subtitle">Accede a tus reservas y actividades favoritas.</p>
</div>

<div class="login-body">

<div th:if="${param.error}" class="login-alert alert-error">
<i class="fa-solid fa-circle-exclamation"></i>
<div>
<strong>No se pudo iniciar sesión</strong>
<div>Email o contraseña incorrectos.</div>
</div>
</div>

<div th:if="${param.logout}" class="login-alert alert-logout">
<i class="fa-solid fa-circle-check"></i>
<div>
<strong>Sesión cerrada</strong>
<div>Has salido correctamente de tu cuenta.</div>
</div>
</div>

<form method="post" action="/login">
<div class="mb-3">
<label class="form-label" for="username">Correo electrónico</label>
<div class="input-group-custom">
<i class="fa-solid fa-envelope input-icon"></i>
<input type="text" id="username" name="username" class="form-control-custom"
placeholder="usuario@correo.com" required>
</div>
</div>

<div class="mb-4">
<label class="form-label" for="password">Contraseña</label>
<div class="input-group-custom">
<i class="fa-solid fa-lock input-icon"></i>
<input type="password" id="password" name="password" class="form-control-custom"
placeholder="Introduce tu contraseña" required>
</div>
</div>

<button type="submit" class="login-btn">
<i class="fa-solid fa-right-to-bracket me-2"></i>
Entrar
</button>
</form>

<div class="login-footer">
¿Todavía no tienes cuenta? <a href="#">Contacta con UrbanActive</a>
</div>
</div>
</div>
</div>

</body>
</html>
