<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Actividades | UrbanActive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .card-activity { 
            transition: all 0.3s ease; 
            border: 1px solid #eee; 
            border-radius: 20px; 
            overflow: hidden; 
            background: white;
        }
        .card-activity:hover { 
            transform: translateY(-8px); 
            shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #0d6efd;
        }
        .img-container { height: 210px; object-fit: cover; }
        .top-nav { background: white; border-bottom: 1px solid #f0f0f0; }
        .info-line { font-size: 0.9rem; color: #666; display: flex; align-items: center; margin-bottom: 0.5rem; }
        .info-line i { width: 20px; color: #0d6efd; margin-right: 8px; }
        .price-tag { font-size: 1.1rem; font-weight: 700; color: #198754; }
    </style>
</head>
<body class="bg-light">

    <nav class="top-nav sticky-top shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <div class="fw-bold fs-3 text-primary"><i class="fas fa-running me-2"></i>UrbanActive</div>
            <div class="d-flex gap-2">
                <a th:href="@{/actividades}" class="btn btn-primary rounded-pill px-4 fw-semibold">Actividades</a>
                <a href="#" class="btn btn-outline-secondary rounded-pill fw-semibold">Mi Perfil</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-5">
            <div class="col-lg-8">
                <h1 class="fw-bold display-5">Actividades disponibles</h1>
                <p class="text-muted fs-5">Encuentra y reserva tu próxima sesión deportiva en la ciudad.</p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 pb-5">
            <div class="col" th:each="actividad : ${actividades}">
                <div class="card h-100 shadow-sm card-activity">
                    <div class="position-relative">
                        <img th:src="${actividad.imagen}" class="card-img-top img-container" alt="Imagen actividad"
                             onerror="this.src='https://via.placeholder.com/400x200?text=UrbanActive'">
                        <span class="position-absolute top-0 end-0 m-3 badge rounded-pill bg-white text-dark shadow-sm px-3 py-2" 
                              th:text="${actividad.tipo}">Tipo</span>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title fw-bold mb-0 text-truncate" th:text="${actividad.titulo}">Título</h5>
                            <span class="price-tag" th:text="${actividad.precio > 0 ? actividad.precio + '€' : 'Gratis'}">0€</span>
                        </div>
                        
                        <div class="info-line">
                            <i class="fas fa-building"></i>
                            <span th:text="${actividad.nombreOrganizador}">Organizador</span>
                        </div>

                        <div class="info-line">
                            <i class="fas fa-map-marker-alt"></i>
                            <span th:text="${actividad.espacioPublico != null ? actividad.espacioPublico.nombre : 'Ubicación pendiente'}">Espacio</span>
                        </div>

                        <div class="info-line mb-4">
                            <i class="far fa-calendar-alt"></i>
                            <span class="fw-semibold" th:text="${actividad.fecha} + ' · ' + ${actividad.hora}">Fecha y Hora</span>
                        </div>

                        <div class="d-grid">
                            <a th:href="@{/actividades/{id}(id=${actividad.id})}" class="btn btn-primary rounded-pill py-2 fw-bold">
                                Ver detalles <i class="fas fa-arrow-right ms-2"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
